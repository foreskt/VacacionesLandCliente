name: Build and upload Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        default: v0.4.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Match version to release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $version) {
            npm version $version --no-git-tag-version
          }
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Upload installer and updater metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
        run: |
          $installer = Get-ChildItem 'release' -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se generó el instalador.' }
          $blockmap = Get-Item ($installer.FullName + '.blockmap')
          gh release upload $env:RELEASE_TAG $installer.FullName $blockmap.FullName 'release/latest.yml' --clobber
